name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Le secret SSH_HOST est manquant}"
          : "${SSH_PRIVATE_KEY:?Le secret SSH_PRIVATE_KEY est manquant}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo '::error::SSH_PRIVATE_KEY doit contenir une clé privée complète, sans passphrase, avec les lignes BEGIN et END. Une clé publique ne convient pas.'
            exit 1
          fi
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload site
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_USER:?Le secret SSH_USER est manquant}"
          : "${SSH_HOST:?Le secret SSH_HOST est manquant}"
          : "${DEPLOY_PATH:?Le secret DEPLOY_PATH est manquant}"
          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" =~ ^/+$ ]]; then
            echo '::error::DEPLOY_PATH doit être un chemin absolu vers le dossier du site, différent de /.'
            exit 1
          fi
          rsync -az --delete \
            -e "ssh -p ${SSH_PORT:-22} -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            out/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
